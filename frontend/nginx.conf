server {
    listen 82;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend, stripping the /api prefix.
    # e.g. GET /api/jobs  →  GET http://backend:8192/jobs
    location /api/ {
        proxy_pass         http://backend:8192/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Vite build assets have content hashes in their filenames; cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: unknown paths serve index.html so React Router works.
    # no-cache forces revalidation so deploys show up without a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
